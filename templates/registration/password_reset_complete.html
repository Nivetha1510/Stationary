{% extends "base.html" %}
{% block title %}Password changed — Supplyhive{% endblock %}

{% block content %}
<section class="container">

    <h1 class="form-card__title">Password changed</h1>
    <p class="form-card__note">Your password has been set. You can now sign in.</p>
    <div class="form-actions">
      <a class="btn btn--pill" href="{% url 'signin' %}">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}
