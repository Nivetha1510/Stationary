{% extends "base.html" %}
{% block title %}Check your email — Supplyhive{% endblock %}

{% block content %}
<section class="container">
  <div class="form-card">
    <h1 class="form-card__title">Check your email</h1>
    <p class="form-card__note">If an account exists for the address you entered, we have sent instructions for choosing a new password. It should arrive shortly.</p>
    <div class="form-actions">
      <a class="btn btn--pill" href="{% url 'signin' %}">Back to sign in</a>
    </div>
  </div>
</section>
{% endblock %}
